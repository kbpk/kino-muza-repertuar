name: Aktualizuj repertuar

on:
  schedule:
    # Dwie próby poza szczytem pełnej godziny oraz godzina ratunkowa dla CET/CEST.
    - cron: "7,37 10-12,16-18 * * *"
    - cron: "7,37 13-15 * * 2"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: repertoire-update
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          ref: main
      - name: Sprawdź godzinę w Polsce
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          weekday="$(TZ=Europe/Warsaw date +%u)"
          local_date="$(TZ=Europe/Warsaw date +%F)"
          raw_hour="$(TZ=Europe/Warsaw date +%H)"
          hour="$((10#$raw_hour))"
          targets=(12 18)
          if [ "$weekday" = "2" ]; then
            targets+=(14 16)
          fi

          target_hour=""
          for candidate in "${targets[@]}"; do
            if [ "$hour" -eq "$candidate" ]; then
              target_hour="$candidate"
              break
            fi
          done
          if [ -z "$target_hour" ]; then
            for candidate in "${targets[@]}"; do
              if [ "$hour" -eq "$((candidate + 1))" ]; then
                target_hour="$candidate"
                break
              fi
            done
          fi

          if [ -z "$target_hour" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf -v target_key "%s %02d" "$local_date" "$target_hour"
          fetched_at="$(jq -r '.fetchedAt // empty' public/data/index.json)"
          fetched_key=""
          if [ -n "$fetched_at" ]; then
            fetched_key="$(TZ=Europe/Warsaw date -d "$fetched_at" '+%F %H' 2>/dev/null || true)"
          fi
          if [ -z "$fetched_key" ] || [[ "$fetched_key" < "$target_key" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Aktualizacja $target_key jest wymagana."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Aktualizacja $target_key już istnieje."
          fi

  update:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Zainstaluj zależności buildowe
        run: npm ci --no-audit --no-fund
      - name: Przywróć cache danych zewnętrznych
        uses: actions/cache@v6
        with:
          path: .cache
          key: muza-metadata-${{ github.run_id }}
          restore-keys: muza-metadata-
      - name: Testy
        run: npm test
      - name: Pobierz bieżący repertuar
        run: npm run build:data
      - name: Utwórz PR z aktualizacją
        id: update-pr
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/repertoire-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/index.json public/data/days public/media/posters
          if git diff --cached --quiet; then
            echo "Brak zmian w repertuarze."
            exit 0
          fi

          git switch -c "$UPDATE_BRANCH"
          git commit -m "data: update repertoire"
          git push --set-upstream origin "$UPDATE_BRANCH"
          pr_url="$(gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "data: aktualizacja repertuaru" \
            --body "Automatyczna aktualizacja z przebiegu $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Automatycznie scal PR po testach
        if: steps.update-pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.update-pr.outputs.url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
      - name: Uruchom publikację scalonej aktualizacji
        if: steps.update-pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yaml --ref main
