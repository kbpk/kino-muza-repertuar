<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta id="theme-color" name="theme-color" content="#ffffff">
    <meta name="description" content="Szybki podgląd repertuaru Kina Muza w Poznaniu.">
    <title>Kino Muza / repertuar</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <script>
      try {
        const theme = localStorage.getItem("muza-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <h1>Kino Muza <span>/ repertuar</span></h1>
        <p id="updated" class="updated" aria-live="polite">Wczytywanie…</p>
        <div class="header-actions">
          <a class="github-link" href="https://github.com/kbpk/kino-muza-repertuar" target="_blank" rel="noopener noreferrer" aria-label="Kod źródłowy na GitHubie" title="Kod źródłowy na GitHubie">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M8 0C3.58 0 0 3.64 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.44-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.87c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.36-3.58-8-8-8"/>
            </svg>
          </a>
          <a class="json-link" href="./data/repertoire.json" target="_blank" rel="noopener noreferrer" aria-label="Aktualny repertuar jako JSON" title="Aktualny repertuar jako JSON"><span aria-hidden="true">{}</span></a>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Zmień motyw" title="Zmień motyw"><span aria-hidden="true">◐</span></button>
        </div>
      </div>
    </header>
    <main>
      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="Sposób prezentacji">
          <button class="tab" role="tab" aria-selected="true" data-view="days">Repertuar</button>
          <button class="tab" role="tab" aria-selected="false" data-view="movies">Tytuły</button>
        </div>
        <div class="filters" aria-label="Filtry repertuaru">
          <label class="filter-field date-filter" hidden>
            <span>Data od</span>
            <span class="native-input-shell">
              <span id="date-from-value" class="native-input-value" aria-hidden="true"></span>
              <input id="date-from" class="date-input" type="date" aria-label="Najwcześniejsza data seansu">
            </span>
          </label>
          <label class="filter-field date-filter" hidden>
            <span>Data do</span>
            <span class="native-input-shell">
              <span id="date-to-value" class="native-input-value" aria-hidden="true"></span>
              <input id="date-to" class="date-input" type="date" aria-label="Najpóźniejsza data seansu">
            </span>
          </label>
          <label class="filter-field time-filter">
            <span>Start od</span>
            <span class="native-input-shell">
              <span id="start-time-value" class="native-input-value" aria-hidden="true"></span>
              <input id="start-time" class="time-input" type="time" aria-label="Najwcześniejsza godzina rozpoczęcia">
            </span>
          </label>
          <label class="filter-field time-filter">
            <span>Koniec do</span>
            <span class="native-input-shell">
              <span id="end-time-value" class="native-input-value" aria-hidden="true"></span>
              <input id="end-time" class="time-input" type="time" aria-label="Najpóźniejsza godzina zakończenia">
            </span>
          </label>
          <div class="filter-field hall-filter">
            <span id="hall-filter-label">Sale</span>
            <details id="hall-dropdown" class="hall-dropdown">
              <summary id="hall-summary" aria-labelledby="hall-filter-label hall-summary">Wszystkie</summary>
              <div class="hall-menu">
                <div class="hall-actions">
                  <button id="hall-select-all" type="button">Zaznacz wszystkie</button>
                  <button id="hall-select-none" type="button">Odznacz</button>
                </div>
                <div id="hall-options" class="hall-options" role="group" aria-labelledby="hall-filter-label"></div>
              </div>
            </details>
          </div>
          <label class="filter-field sort-filter">
            <span>Sortuj</span>
            <select id="sort" class="sort-input">
              <option value="title">Alfabetycznie</option>
              <option value="filmweb">Ocena Filmweb</option>
              <option value="imdb">Ocena IMDb</option>
              <option value="rottenTomatoes">Ocena Rotten Tomatoes</option>
              <option value="firstShowing">Pierwszy seans</option>
            </select>
          </label>
          <div id="search-row" class="search-row">
            <label class="filter-field search-filter">
              <span>Szukaj</span>
              <input id="search" type="search" placeholder="Tytuł…" autocomplete="off">
            </label>
            <button id="filter-clear" class="filter-clear" type="button" aria-label="Wyczyść filtry dat, godzin i sali" title="Wyczyść filtry dat, godzin i sali" hidden>×</button>
          </div>
        </div>
      </div>
      <p id="freshness-warning" class="freshness-warning" role="alert" hidden>Repertuar nie zaktualizował się o oczekiwanej porze i może być nieaktualny.</p>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="content"><p class="loading">Wczytywanie repertuaru…</p></div>
    </main>
    <footer>Nieoficjalny podgląd · <a href="https://www.kinomuza.pl/repertuar/">kinomuza.pl</a></footer>
  </body>
</html>
